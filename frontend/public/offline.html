<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — AniVerse</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A10;
      color: #E8E8ED;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    div { max-width: 380px; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { color: #9A9AA6; font-size: 0.95rem; line-height: 1.5; }
    button {
      margin-top: 1.5rem;
      background: #F0296A;
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>AniVerse needs an internet connection to load anime data. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
