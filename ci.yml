name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue up
# stale CI runs behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SQLite needs no external service — every job gets a throwaway DB file.
  DATABASE_URL: "file:./ci.db"
  NEXTAUTH_SECRET: "ci-test-secret-not-for-production-use-000000"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` already fails on lockfile/package.json drift; audit here
      # catches known-vulnerable dependencies. --audit-level=high so a
      # long tail of low-severity transitive advisories doesn't turn CI
      # red on every run — moderate-and-below still show in the log.
      - run: npm ci
      - run: npm audit --audit-level=high

  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma db push
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma db push

      - name: Build
        run: npm run build
        env:
          # Build-time-only placeholders — real deploys supply their own
          # secrets via the hosting platform's env config, not this file.
          RESEND_API_KEY: ""
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
          RECAPTCHA_SECRET_KEY: ""

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
